[profile.default]
src = "src"
out = "out"
libs = ["lib", "../node_modules"]
test = "test"
script = "script"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"

# Lets the conformance test emit canonical-command fixtures the TypeScript SDK
# checks its mirror against. Scoped to that one directory.
fs_permissions = [{ access = "read-write", path = "./test/fixtures" }]

[profile.default.fuzz]
runs = 10_000
max_test_rejects = 500_000

[profile.default.invariant]
runs = 256
depth = 128
fail_on_revert = false
call_override = false
shrink_run_limit = 5000

# Fast profile for tight edit/test loops: `FOUNDRY_PROFILE=lite forge test`
[profile.lite.fuzz]
runs = 256

[profile.lite.invariant]
runs = 16
depth = 32
fail_on_revert = false

[profile.ci.fuzz]
runs = 50_000

[profile.ci.invariant]
runs = 512
depth = 256
fail_on_revert = false

[rpc_endpoints]
base = "${BASE_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

[etherscan]
base = { key = "${BASESCAN_API_KEY}", chain = 8453 }
base_sepolia = { key = "${BASESCAN_API_KEY}", chain = 84532 }

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"
